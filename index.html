
<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corporativo Becam | Sistema Institucional de Autenticación de Certificados</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif;background:#f5f6f8;margin:0;color:#222}
header{background:#c8102e;color:#fff;padding:24px;text-align:center}
.container{max-width:900px;margin:30px auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
input{width:100%;padding:12px;border:1px solid #bbb;border-radius:6px;font-size:16px}
button{margin-top:15px;background:#c8102e;color:#fff;border:0;padding:12px 24px;border-radius:6px;font-size:16px;cursor:pointer}
button:hover{background:#a30d24}
#loader{display:none;text-align:center;padding:20px}
.card{display:none;border-left:5px solid #28a745;background:#fafafa;padding:20px;margin-top:20px}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #ddd;padding:8px}
th{background:#eee}
footer{text-align:center;color:#666;padding:20px}
.ok{color:#28a745;font-weight:700}
.err{color:#c8102e;font-weight:700}
</style></head><body>
<header><h1>Corporativo Becam</h1><h2>Sistema Institucional de Autenticación de Certificados</h2>
<p>Verifique la autenticidad de los certificados emitidos por Corporativo Becam.</p></header>
<div class="container">
<label><b>Ingrese el folio del certificado</b></label>
<input id="folio" placeholder="CAP-HAB-001">
<button onclick="validar()">Validar certificado</button>
<div id="loader">Validando certificado...</div>
<div id="resultado" class="card"></div>
</div><footer>© 2026 Corporativo Becam | Sistema Institucional de Autenticación de Certificados</footer>
<script>
const db={
"CAP-HAB-001":{n:"PSIC. Nancy Silvana Zavala Velazco",c:"Pirma CEDIS",p:20},
"CAP-HAB-002":{n:"Lic. Karla Lisset Rubio Hernández",c:"Pirma – Sucursales Locales (Puebla)",p:40},
"CAP-HAB-003":{n:"Lic. José Manuel Rodríguez Gaona",c:"Pirma – Sucursales Locales (Puebla)",p:40}
};
function validar(){
let f=document.getElementById('folio').value.trim().toUpperCase();
let r=document.getElementById('resultado');
r.style.display='none';
loader.style.display='block';
setTimeout(()=>{
loader.style.display='none';
if(!db[f]){
r.innerHTML="<h2 class='err'>Folio no encontrado</h2><p>El folio consultado no se encuentra registrado en la base de datos institucional de Corporativo Becam.</p>";
r.style.display='block';return;}
let d=db[f],fecha=new Date().toLocaleString("es-MX");
r.innerHTML=`<h2 class='ok'>CERTIFICADO VÁLIDO</h2>
<p>El folio consultado se encuentra registrado en la base de datos institucional de Corporativo Becam.</p>
<h3>Información del certificado</h3>
<p><b>Folio:</b> ${f}<br><b>Instructor:</b> ${d.n}<br>
<b>Empresa beneficiaria:</b> Pirma<br><b>Centro de aplicación:</b> ${d.c}<br>
<b>Programa:</b> Trabajo en equipo, Liderazgo, Comunicación asertiva, Gestión del tiempo, Protocolo de servicio, Gestión Emocional, Alineación práctica a la NMX-R-025-SCFI-2015 en Igualdad Laboral y No Discriminación, Manejo de conflictos y Orientación a resultados.<br>
<b>Periodo:</b> Agosto – Septiembre de 2026<br>
<b>Duración:</b> 2 meses<br>
<b>Participantes promedio:</b> ${d.p} colaboradores por curso.</p>
<h3>Resultado de la validación institucional</h3>
<table><tr><th>Concepto</th><th>Resultado</th></tr>
<tr><td>Estado del certificado</td><td>Válido</td></tr>
<tr><td>Registro institucional</td><td>Encontrado</td></tr>
<tr><td>Integridad del documento</td><td>Verificada</td></tr>
<tr><td>Organismo emisor</td><td>Corporativo Becam</td></tr>
<tr><td>Estatus</td><td>Vigente</td></tr>
<tr><td>Fecha y hora de consulta</td><td>${fecha}</td></tr>
<tr><td>Código de validación</td><td>${f}</td></tr></table>
<p><b>Observaciones institucionales</b><br>El certificado consultado fue emitido por Corporativo Becam y forma parte del registro institucional de constancias de capacitación.</p>`;
r.style.display='block';
},1200)}
</script></body></html>
